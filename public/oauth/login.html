<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - GoHighLevel MCP</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 2rem; background: #f9fafb; }
      h2 { text-align: center; margin-bottom: 1rem; color: #111827; }
    </style>
  </head>
  <body>
    <div>
      <h2>Sign in to continue</h2>
      <div id="login"></div>
    </div>
    <script type="module">
      import { OAuthProviders, Products, StytchUIClient } from 'https://esm.sh/@stytch/vanilla-js';

      const RETURN_KEY = 'ghl_mcp_oauth_return';
      const publicToken = document.documentElement.dataset.stytchToken;
      const stytch = new StytchUIClient(publicToken);

      const config = {
        products: [Products.emailMagicLinks, Products.oauth],
        emailMagicLinksOptions: {
          loginRedirectURL: window.location.origin + '/oauth/authenticate',
          signupRedirectURL: window.location.origin + '/oauth/authenticate',
        },
        oauthOptions: {
          providers: [{ type: OAuthProviders.Google }],
          loginRedirectURL: window.location.origin + '/oauth/authenticate',
          signupRedirectURL: window.location.origin + '/oauth/authenticate',
        },
      };

      const callbacks = {
        onEvent: (evt) => {
          if (evt.type !== 'AUTHENTICATE_FLOW_COMPLETE') return;
          // OTP/password flows complete in the same tab — redirect back to authorize
          const returnTo = localStorage.getItem(RETURN_KEY);
          if (returnTo) {
            localStorage.removeItem(RETURN_KEY);
            window.location.href = returnTo;
          } else {
            // Fallback: go to authorize without params (will show an error, but won't leak to /)
            window.location.href = window.location.origin + '/oauth/authorize';
          }
        },
      };

      // Mount the login UI. When loaded via CDN (esm.sh), the custom element
      // needs an explicit render() call to receive the client instance.
      stytch.mountLogin({ elementId: '#login', config, callbacks });

      await customElements.whenDefined('stytch-ui');
      const el = document.querySelector('#login stytch-ui');
      if (el?.render) {
        el.render({ client: stytch, config, callbacks });
      }
    </script>
  </body>
</html>
